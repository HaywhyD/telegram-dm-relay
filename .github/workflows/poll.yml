name: Poll DMs and relay to Telegram

on:
  schedule:
    # GitHub Actions cron has no sub-minute resolution, and anything
    # shorter than every-5-minutes on ONE cron line is silently
    # dropped/skipped. But you *can* stack multiple 5-minute-cadence cron
    # lines at different minute offsets within that 5-minute window, since
    # each line is independently "every 5 minutes" and they just land on
    # different minutes. Minute offsets only go 0-4 before they repeat, so
    # 5 lines is the real ceiling -- a 6th line would just double up with
    # one of these. Together these 5 give an effective ~1-minute cadence
    # (see README.md "Polling frequency" for the full math, and why going
    # further than this isn't useful and may not even be safe).
    - cron: "0-59/5 * * * *"   # :00, :05, :10, ...
    - cron: "1-59/5 * * * *"   # :01, :06, :11, ...
    - cron: "2-59/5 * * * *"   # :02, :07, :12, ...
    - cron: "3-59/5 * * * *"   # :03, :08, :13, ...
    - cron: "4-59/5 * * * *"   # :04, :09, :14, ...
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  # If a run ever takes long enough to still be going when the next one's
  # scheduled minute arrives (shouldn't normally happen -- each run takes
  # well under a minute -- but network slowness or a retry could do it),
  # queue the next one instead of letting two runs touch state.json and
  # the Telegram chat at the same time. Racing writers to state.json would
  # risk duplicate-forwarded DMs (two runs both deciding the same message
  # is "new" before either one's seen-id update lands) and a messy git
  # push conflict. cancel-in-progress is deliberately false: we want every
  # run to still happen, just not overlap.
  group: poll-dms
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state.json/accounts.enc back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Patch twikit for X's homepage migration (2026-10)
        # X's logged-out x.com homepage now redirects to an onboarding page
        # that doesn't carry the webpack chunk map twikit's ClientTransaction
        # needs. /i/jf/ still has it. Without this, EVERY request (login or
        # cookie-auth) fails with "Couldn't get KEY_BYTE indices". Confirmed
        # fix, upstream PR not yet merged: iSarabjitDhiman/XClientTransaction#48
        run: |
          PKG_DIR=$(python -c "import twikit, os; print(os.path.dirname(twikit.__file__))")
          sed -i 's#url="https://x.com", headers=headers#url="https://x.com/i/jf/", headers=headers#' \
            "$PKG_DIR/x_client_transaction/utils.py"
          grep -n 'url="https' "$PKG_DIR/x_client_transaction/utils.py"

      - name: Register new accounts from Telegram
        # Lets account owners self-register by sending one message to the
        # bot (see register.py's docstring and README.md). Runs before the
        # poll step so a brand-new registration is picked up starting next
        # run, not left waiting an extra cycle.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
          REGISTRATION_CODE: ${{ secrets.REGISTRATION_CODE }}
        run: python register.py

      - name: Run poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
        run: python poller.py

      - name: Commit updated state
        run: |
          git config user.name "dm-relay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json accounts.enc registration_state.json
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Update DM state / accounts [skip ci]"

          # actions/checkout@v4 pins to whatever main looked like when THIS
          # run was queued, not when it actually started. With several
          # cron-offset schedules plus the concurrency group above, a run
          # can sit queued behind another one that pushes in the meantime
          # -- so origin/main has moved past what we checked out by the
          # time we get here, and a plain "git push" is rejected as
          # non-fast-forward. state.json/accounts.enc/registration_state.json
          # are all just-data files where "rebase onto whatever's newest"
          # is always the right resolution (there's nothing to meaningfully
          # merge), so retry with a rebase instead of failing the job.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push updated state after 5 attempts"
          exit 1
